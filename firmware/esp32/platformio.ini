; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1

framework = arduino
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200

; Leave upload_port unset so PlatformIO can auto-detect the connected ESP32 serial port.
; If auto-detection picks the wrong device, set it explicitly, for example:
; upload_port = /dev/cu.usbserial-0001

build_flags =
	-DCORE_DEBUG_LEVEL=0

; change microcontroller
board_build.mcu = esp32

; change MCU frequency
board_build.f_cpu = 240000000L

lib_deps = 
	AsyncMqttClient@0.9.0
	me-no-dev/AsyncTCP@^3.3.2
	luc-github/ESP32SSDP@^1.2.1
	bblanchon/ArduinoJson@^7.2.2

targets = upload, monitor
