<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Something wrong</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                background-color: #f8f9fa;
                color: #333;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 20px;
            }
            .error-container {
                text-align: center;
                max-width: 450px;
                width: 100%;
                background: #ffffff;
                padding: 40px 30px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            }
            .error-icon {
                font-size: 64px;
                margin-bottom: 20px;
            }
            h1 {
                font-size: 24px;
                font-weight: 700;
                margin-bottom: 12px;
                color: #1a1a1a;
            }
            p {
                font-size: 16px;
                color: #666;
                line-height: 1.5;
                margin-bottom: 30px;
            }
            .btn {
                display: inline-block;
                background-color: #007aff;
                color: #fff;
                text-decoration: none;
                padding: 12px 24px;
                border-radius: 8px;
                font-weight: 600;
                font-size: 15px;
                transition: background-color 0.2s ease;
            }
            .btn:hover {
                background-color: #0056b3;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background-color: #121212;
                    color: #e0e0e0;
                }
                .error-container {
                    background: #1e1e1e;
                    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                }
                h1 {
                    color: #fff;
                }
                p {
                    color: #aaa;
                }
                .btn {
                    background-color: #0a84ff;
                }
                .btn:hover {
                    background-color: #0066cc;
                }
            }
        </style>
    </head>
    <body>
        <div class="error-container">
            <div class="error-icon">⚠️</div>
            <h1>Something wrong.</h1>
            <p>
                There was an error on the server, or the page you requested is
                temporarily unavailable. Please check your requests parameters
                or try refreshing the page later.
            </p>
            <!-- Action button -->
            <a href="/" class="btn">To Main</a>
        </div>
    </body>
</html>
