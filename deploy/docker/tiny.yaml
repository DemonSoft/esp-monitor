networks:
  esp_network:
    driver: bridge

services:
  # ============================================================================
  # CORE SERVICES (Always run, Tiny profile by default)
  # ============================================================================
  esp-server:
    image: demonsoft/esp-server:${APP_VERSION}
    container_name: esp-server
    restart: unless-stopped
    ports:
      - "${REST_PORT}:80"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - XTOKEN=${XTOKEN}
      - MQTT_PROTOCOL=mqtt://
      - MQTT_HOST=test.mosquitto.org
      - MQTT_PORT=1883
      - MQTT_USERNAME=
      - MQTT_PASSWORD=
      - MQTT_ROOT=${MQTT_ROOT}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID}
      - MQTT_KEEP_ALIVE=${MQTT_KEEP_ALIVE}
      - MQTT_PING_TIMEOUT=${MQTT_PING_TIMEOUT}
      - KAFKA_RUN=false
    networks:
      - esp_network
    volumes:
      - sqlite_data:/app
      
volumes:
  sqlite_data: