networks:
  esp_network:
    driver: bridge

services:
  # ============================================================================
  # CORE SERVICES (Всегда запускаются, профиль Tiny по умолчанию)
  # ============================================================================
  esp-server:
    image: demonsoft/esp-server:${APP_VERSION}
    container_name: esp-server
    restart: unless-stopped
    ports:
      - "${REST_PORT}:80"
    depends_on:
      kafka:
        condition: service_healthy
        required: false # <--- КРИТИЧЕСКИ ВАЖНО: если профиль без Кафки, сервер все равно запустится!
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - XTOKEN=${XTOKEN}
      - MQTT_PROTOCOL=${MQTT_PROTOCOL}
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_ROOT=${MQTT_ROOT}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID}
      - MQTT_KEEP_ALIVE=${MQTT_KEEP_ALIVE}
      - MQTT_PING_TIMEOUT=${MQTT_PING_TIMEOUT}
      - KAFKA_RUN=${KAFKA_RUN}
      - KAFKA_HOST=${KAFKA_HOST}
      - KAFKA_PORT=${KAFKA_PORT}
      - KAFKA_DEFAULT_TOPIC=${KAFKA_DEFAULT_TOPIC}
    networks:
      - esp_network
    volumes:
      - sqlite_data:/app

  # ============================================================================
  # SMALL PROFILE (Локальный MQTT брокер)
  # ============================================================================
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION}
    container_name: mosquitto
    restart: unless-stopped
    profiles: ["small", "medium", "large"]
    ports:
      - "1883:1883"
      - "9001:9001"
    command: mosquitto -c /mosquitto/config/mosquitto.conf  
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - esp_network

  # ============================================================================
  # MEDIUM PROFILE (Брокер + Кафка + Веб-интерфейс + Воркеры)
  # ============================================================================
  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka
    restart: unless-stopped
    profiles: ["medium", "large"]
    ports:
      - "9092:9092" # Внутренний/внешний порт по умолчанию
      - "9094:9094" # ЧИСТО ДЛЯ ВАШЕГО MAC (ЛОКАЛЬНОГО СЕРВЕРА)
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_LOG_DIRS: ${KAFKA_LOG_DIRS}
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      
      # Оставляем старый синтаксис listeners, но добавляем EXTERNAL порт
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093'
      
      # Вот правильный маппинг адресов брокера:
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094'
      
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 1

      KAFKA_TRANSACTION_STATE_LOG_OVERWRITE_REPLICATION_FACTOR: 1
      KAFKA_PRODUCER_ID_EXPIRATION_MS: 86400000


    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - esp_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s

  kafka-init-topics:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka-init-topics
    profiles: ["medium", "large"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - esp_network
    # Полностью сбрасываем зашитый внутренний пускач образа на чистую оболочку
    entrypoint: [ "/bin/bash", "-c" ]
    # Передаем команды как единый текстовый аргумент для bash
    command: >
      "
      echo '=== STARTING TOPIC CREATION ===' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic root --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic actions --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic logs --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pins --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic anomalies --partitions 1 --replication-factor 1 &&
      echo '=== CURRENT KAFKA TOPICS ===' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "

  kafdrop:
    image: obsidiandynamics/kafdrop:${KAFDROP_VERSION:-latest}
    container_name: kafdrop
    restart: unless-stopped
    profiles: ["medium", "large"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFDROP_PORT:-9000}:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
      JVM_OPTS: "-Xms32M -Xmx64M" # Легковесные лимиты памяти для коробки
      SERVER_SERVLET_CONTEXT_PATH: "/"
    networks:
      - esp_network

  kworker:
    image: demonsoft/kworker:${APP_VERSION}
    container_name: kworker
    restart: unless-stopped
    profiles: ["medium", "large"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_HOST=${KAFKA_HOST}
      - KAFKA_PORT=${KAFKA_PORT}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    networks:
      - esp_network

  ai-worker:
    image: demonsoft/ai-worker:${APP_VERSION}
    container_name: ai-worker
    restart: unless-stopped
    profiles: ["medium", "large"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_HOST=${KAFKA_HOST}
      - KAFKA_PORT=${KAFKA_PORT}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    networks:
      - esp_network

  hworker:
    image: demonsoft/hworker:${APP_VERSION}
    container_name: hworker
    restart: unless-stopped
    profiles: ["medium", "large"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_HOST=${KAFKA_HOST}
      - KAFKA_PORT=${KAFKA_PORT}
      - WEBHOOK_URL=${WEBHOOK_URL}
    networks:
      - esp_network

  # ============================================================================
  # LARGE PROFILE (Полный стек + Системный мониторинг)
  # ============================================================================
  vector:
    image: timberio/vector:${VECTOR_VERSION}
    container_name: vector
    restart: unless-stopped
    profiles: ["large"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
    networks:
      - esp_network

  victoria-metrics:
    image: victoriametrics/victoria-metrics:${VICTORIAMETRICS_VERSION}
    container_name: victoria-metrics
    restart: unless-stopped
    profiles: ["large"]
    ports:
      - "8428:8428"
    volumes:
      - victoria_data:/victoria-metrics-data
    networks:
      - esp_network

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: unless-stopped
    profiles: ["large"]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - esp_network

volumes:
  sqlite_data:
  mosquitto_data:
  mosquitto_log:
  kafka_data:
  victoria_data:
  grafana_data: