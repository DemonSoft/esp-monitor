apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
data:
  vector.yaml: |
    sources:
      esp_kafka_source:
        type: "kafka"
        # Address of the broker inside K8s (port for internal services)
        bootstrap_servers: "kafka-service:29092"
        topics: 
          - "pins"
        group_id: "vector-monitoring-group"
        auto_offset_reset: "smallest"
        key_field: "kafka_key"

    transforms:
      format_metrics:
        type: "remap"
        inputs:
          - "esp_kafka_source"
        source: |
          device_id = string!(.kafka_key)
          message_body = string!(.message)
          
          parsed_pins, err = parse_key_value(message_body, field_delimiter: " ", key_value_delimiter: ":")
          if err != null {
            log("Failed to parse ESP message: " + err, level: "error")
            abort
          }

          .pins = parsed_pins
          .device_id = device_id
          
          del(.message)
          del(.kafka_key)

      to_vector_metrics:
        type: "log_to_metric"
        inputs:
          - "format_metrics"
        metrics:
          - type: "gauge"
            field: "pins.*"
            name: "esp_gpio_status"
            namespace: "" 
            tags:
              device_id: "{{device_id}}"
              pin: "{{_field_name}}"

    sinks:
      stdout_debug:
        type: "console"
        inputs:
          - "to_vector_metrics"
        encoding:
          codec: "json"

      victoria_metrics_sink:
        type: "prometheus_remote_write"
        inputs:
          - "to_vector_metrics"
        # Send to the internal K8s service VictoriaMetrics
        endpoint: "http://victoria-metrics-service:8428/api/v1/write"
        healthcheck:
          enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics-service
spec:
  selector:
    app: victoria-metrics
  ports:
    - port: 8428
      targetPort: 8428
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      containers:
      - name: victoria-metrics
        image: victoriametrics/victoria-metrics:v1.101.0 # Фиксируем стабильную версию
        ports:
        - containerPort: 8428
        volumeMounts:
        - name: vm-data
          mountPath: /victoria-metrics-data
      volumes:
      - name: vm-data
        persistentVolumeClaim:
          claimName: victoriametrics-pvc # Подключаем PVC из нашего общего pvc-stack.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      containers:
      - name: vector
        image: timberio/vector:0.38.0-debian
        volumeMounts:
        - name: config-volume
          mountPath: /etc/vector
      volumes:
      - name: config-volume
        configMap:
          name: vector-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.4.1
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  type: LoadBalancer 
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31300