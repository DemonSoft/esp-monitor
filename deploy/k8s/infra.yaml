# Kafka Topic Initialization Job
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics-job
spec:
  template:
    spec:
      
      initContainers:
      - name: wait-for-kafka
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -w 2 kafka-service 9092; do echo "Waiting for Kafka..."; sleep 2; done']

      restartPolicy: OnFailure
      containers:
      - name: kafka-init-topics
        image: apache/kafka:3.7.0
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "=== Waiting for Kafka to be ready ===" &&
          sleep 10 &&
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-service:9092 --create --if-not-exists --topic root --partitions 1 --replication-factor 1 &&
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-service:9092 --create --if-not-exists --topic actions --partitions 1 --replication-factor 1 &&
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-service:9092 --create --if-not-exists --topic logs --partitions 1 --replication-factor 1 &&
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-service:9092 --create --if-not-exists --topic pins --partitions 1 --replication-factor 1 &&
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-service:9092 --create --if-not-exists --topic anomalies --partitions 1 --replication-factor 1 &&
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-service:9092 --create --if-not-exists --topic photos --partitions 1 --replication-factor 1 &&
          echo "=== Topics created successfully ==="

