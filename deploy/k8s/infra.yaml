---
# --- PART 4: APPLICATIONS (esp-server & Kafka Init Job) ---
# esp-server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esp-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esp-server
  template:
    metadata:
      labels:
        app: esp-server
    spec:
      
      initContainers:
      - name: wait-for-infra
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -w 2 kafka-service 9092 && nc -z -w 2 mosquitto-service 1883; do echo "Waiting for Kafka and Mosquitto..."; sleep 2; done']

      containers:
      - name: esp-server
        image: demonsoft/esp-server:latest
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: XTOKEN
          value: "00000000-0000-0000-0000-000000000000"
        - name: REST_PORT
          value: "80"
        - name: MQTT_HOST
          value: "mosquitto-service"
        - name: MQTT_PORT
          value: "1883"
        - name: MQTT_PROTOCOL
          value: "mqtt://"
        - name: MQTT_ROOT
          value: "root"
        - name: KAFKA_RUN
          value: "true"
        - name: KAFKA_HOST
          value: "kafka-service"
        - name: KAFKA_PORT
          value: "9092"
        - name: KAFKA_DEFAULT_TOPIC
          value: "root"
---
apiVersion: v1
kind: Service
metadata:
  name: esp-server-service
spec:
  selector:
    app: esp-server
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: LoadBalancer

